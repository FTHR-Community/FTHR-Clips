name: Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match FTHR_UI/version.py, for example v1.1.0-alpha)'
        required: true
        default: v1.1.0-alpha
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: linux-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Linux branch
        uses: actions/checkout@v4
        with:
          ref: linux
          fetch-depth: 0

      - name: Check tag matches source version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(python3 -c "import sys; sys.path.insert(0, 'FTHR_UI'); import version; print(version.__version__)")"
          expected="v${version}"
          test "$RELEASE_TAG" = "$expected" || {
            echo "Release tag $RELEASE_TAG does not match source version $expected" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-alpha.txt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y \
            cmake g++ pkg-config curl file binutils squashfs-tools libfuse2 \
            libportaudio2 libavcodec-dev libavfilter-dev libavformat-dev \
            libavutil-dev libavdevice-dev libswscale-dev libswresample-dev \
            libpulse-dev libwayland-dev wayland-protocols libwayland-bin \
            libx11-dev libgl1 libegl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxkbcommon-x11-0 libxext-dev libxfixes-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements-alpha.txt pyinstaller

      - name: Build AppImage
        run: bash build_linux.sh

      - name: Verify AppImage and checksum
        run: |
          image="build_output/FTHRClips-$(python -c "import sys; sys.path.insert(0, 'FTHR_UI'); import version; print(version.__version__)")-x86_64.AppImage"
          test -x "$image"
          test -s "$image.sha256"
          (cd "$(dirname "$image")" && sha256sum -c "$(basename "$image.sha256")")
          file "$image" | grep -qi 'ELF.*x86-64'
          rm -rf /tmp/fthr-appimage-root
          mkdir /tmp/fthr-appimage-root
          (cd /tmp/fthr-appimage-root && APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null)
          test -x /tmp/fthr-appimage-root/squashfs-root/AppRun
          test -x /tmp/fthr-appimage-root/squashfs-root/FTHRClips
          test -f /tmp/fthr-appimage-root/squashfs-root/_internal/plugin-packages/FTHR-Uploader-linux.fthrplugin

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          image="build_output/FTHRClips-$(python -c "import sys; sys.path.insert(0, 'FTHR_UI'); import version; print(version.__version__)")-x86_64.AppImage"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          prerelease_flag=()
          if [ "$PRERELEASE" = true ]; then prerelease_flag=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$image" "$image.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target linux \
            --title "FTHR Clips ${RELEASE_TAG#v} (Linux)" \
            "${prerelease_flag[@]}" \
            --notes-file <(cat <<'NOTES'
          ## FTHR Clips Linux release

          This AppImage was built from the upstream `linux` branch by GitHub Actions.

          The qualified path is x86_64 Linux with a native Wayland desktop. The
          Linux branch includes Wayland capture, PipeWire/PulseAudio desktop audio,
          Hyprland hotkeys, AMD VA-API when available, software fallback, and the
          optional consent-gated Linux uploader bundle.

          Lustful hardware-bound uploading is not available on Linux. Catbox and
          custom-server uploading remain consent-gated optional providers.

          Verify the AppImage with the adjacent `.sha256` file before launching.
          NOTES
          )
