<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <title>Maintenance // FTHRClips</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --panel: #070908;
            --panel-strong: #0b0e0d;
            --border: #202624;
            --accent: #00ffaa;
            --white: #f4f7f6;
            --muted: #89918e;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            color: var(--white);
            background:
                radial-gradient(circle at 50% 46%, rgba(0, 255, 170, 0.055), transparent 34rem),
                radial-gradient(circle, rgba(255, 255, 255, 0.11) 1px, transparent 1px),
                var(--black);
            background-size: auto, 28px 28px, auto;
            font-family: 'Inter', sans-serif;
            padding: clamp(1rem, 4vw, 3rem);
        }

        .maintenance-shell {
            width: min(920px, 100%);
            border: 1px solid var(--border);
            background: rgba(3, 4, 4, 0.96);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.72);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 72px;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--white);
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .brand img {
            width: 46px;
            height: 46px;
            object-fit: contain;
        }

        .system-state {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .system-state::before {
            content: '';
            width: 7px;
            height: 7px;
            background: var(--accent);
            box-shadow: 0 0 12px rgba(0, 255, 170, 0.85);
            animation: pulse 1.4s steps(2, end) infinite;
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 190px;
        }

        .message {
            padding: clamp(2rem, 7vw, 5.5rem) clamp(1.4rem, 6vw, 4.5rem);
        }

        .eyebrow {
            margin-bottom: 1.2rem;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 650px;
            margin: 0;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(3.3rem, 9vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 0.88;
            text-transform: uppercase;
        }

        h1 span {
            display: block;
            color: var(--accent);
        }

        .message p {
            max-width: 560px;
            margin: 1.7rem 0 0;
            color: var(--muted);
            font-size: clamp(0.9rem, 2vw, 1rem);
            line-height: 1.75;
        }

        .status-rail {
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            border-left: 1px solid var(--border);
            background: var(--panel);
        }

        .status-cell {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 118px;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .status-cell:last-child {
            border-bottom: 0;
        }

        .status-cell small,
        .status-cell strong {
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }

        .status-cell small {
            color: #626a67;
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.15em;
        }

        .status-cell strong {
            color: var(--white);
            font-size: 0.66rem;
            letter-spacing: 0.08em;
            line-height: 1.45;
        }

        .status-cell:first-child strong {
            color: var(--accent);
        }

        .progress {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
            height: 10px;
            padding: 3px;
            border-top: 1px solid var(--border);
            background: var(--panel-strong);
        }

        .progress span {
            background: #151a18;
            animation: scan 2.8s steps(1, end) infinite;
        }

        .progress span:nth-child(2) { animation-delay: 0.14s; }
        .progress span:nth-child(3) { animation-delay: 0.28s; }
        .progress span:nth-child(4) { animation-delay: 0.42s; }
        .progress span:nth-child(5) { animation-delay: 0.56s; }
        .progress span:nth-child(6) { animation-delay: 0.70s; }
        .progress span:nth-child(7) { animation-delay: 0.84s; }
        .progress span:nth-child(8) { animation-delay: 0.98s; }
        .progress span:nth-child(9) { animation-delay: 1.12s; }
        .progress span:nth-child(10) { animation-delay: 1.26s; }
        .progress span:nth-child(11) { animation-delay: 1.40s; }
        .progress span:nth-child(12) { animation-delay: 1.54s; }
        .progress span:nth-child(13) { animation-delay: 1.68s; }
        .progress span:nth-child(14) { animation-delay: 1.82s; }
        .progress span:nth-child(15) { animation-delay: 1.96s; }
        .progress span:nth-child(16) { animation-delay: 2.10s; }
        .progress span:nth-child(17) { animation-delay: 2.24s; }
        .progress span:nth-child(18) { animation-delay: 2.38s; }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            min-height: 54px;
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            color: #666e6b;
            background: var(--panel);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.56rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .footer a {
            color: var(--white);
            text-decoration: none;
        }

        .footer a:hover,
        .footer a:focus-visible {
            color: var(--accent);
        }

        .footer a:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: 5px;
        }

        @keyframes pulse {
            50% { opacity: 0.3; }
        }

        @keyframes scan {
            0%, 44% { background: #151a18; }
            45%, 58% { background: var(--accent); box-shadow: 0 0 8px rgba(0, 255, 170, 0.7); }
            59%, 100% { background: #151a18; box-shadow: none; }
        }

        @media (max-width: 700px) {
            body {
                place-items: stretch;
                padding: 0;
            }

            .maintenance-shell {
                min-height: 100vh;
                min-height: 100dvh;
                border: 0;
            }

            main {
                grid-template-columns: 1fr;
            }

            .message {
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-height: 55vh;
            }

            .status-rail {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: 1fr;
                border-top: 1px solid var(--border);
                border-left: 0;
            }

            .status-cell {
                min-height: 96px;
                border-right: 1px solid var(--border);
                border-bottom: 0;
            }

            .status-cell:last-child {
                border-right: 0;
            }
        }

        @media (max-width: 440px) {
            .topbar {
                min-height: 64px;
            }

            .brand img {
                width: 40px;
                height: 40px;
            }

            .system-state span {
                display: none;
            }

            .message {
                padding: 2.5rem 1.25rem;
            }

            .status-rail {
                grid-template-columns: 1fr;
            }

            .status-cell {
                min-height: 70px;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }

            .footer {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .system-state::before,
            .progress span {
                animation: none;
            }

            .progress span:nth-child(-n+8) {
                background: var(--accent);
            }
        }
    </style>
</head>
<body>
    <section class="maintenance-shell" aria-labelledby="maintenance-title">
        <header class="topbar">
            <div class="brand">
                <img src="favicon.svg" alt="">
                <span>FTHRClips</span>
            </div>
            <div class="system-state"><span>Maintenance in progress</span></div>
        </header>

        <main>
            <div class="message">
                <div class="eyebrow">System Notice // 503</div>
                <h1 id="maintenance-title">Under <span>Maintenance.</span></h1>
                <p>FTHRClips is temporarily offline while we work on the site. We&rsquo;ll be back soon.</p>
            </div>

            <aside class="status-rail" aria-label="Maintenance status">
                <div class="status-cell">
                    <small>Status</small>
                    <strong>Maintenance</strong>
                </div>
                <div class="status-cell">
                    <small>Your clips</small>
                    <strong>Still yours</strong>
                </div>
                <div class="status-cell">
                    <small>Return</small>
                    <strong>Back soon</strong>
                </div>
            </aside>
        </main>

        <div class="progress" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <footer class="footer">
            <span>&copy; 2026 FTHR Software</span>
            <a href="https://discord.gg/fthrclips" target="_blank" rel="noopener noreferrer">Updates on Discord &rarr;</a>
        </footer>
    </section>
</body>
</html>
