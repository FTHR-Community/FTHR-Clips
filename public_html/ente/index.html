<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>FTHRClips &mdash; Socials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
    <canvas class="dot-field" id="dotField" aria-hidden="true"></canvas>

    <main class="link-stack" aria-label="FTHRClips social links">
        <a class="link-card link-card--video" href="https://youtu.be/g1NoVpXnD9I?si=c1iaOLSHGyH1JbK7" target="_blank" rel="noopener noreferrer">
            <span class="link-card__start">
                <span class="link-card__icon" aria-hidden="true"><img src="assets/youtube.svg" alt=""></span>
                <span>OLGA EXPOSED</span>
            </span>
            <span class="arrow" aria-hidden="true">&nearr;</span>
        </a>
        <a class="link-card link-card--site" href="https://fthrclips.com" target="_blank" rel="noopener noreferrer">
            <span class="link-card__start">
                <span class="link-card__icon link-card__icon--fthr" aria-hidden="true"><img src="assets/fthrclips-logo.png" alt=""></span>
                <span>Meine Webseite FTHRClips</span>
            </span>
            <span class="arrow" aria-hidden="true">&nearr;</span>
        </a>
        <a class="link-card link-card--discord" href="https://discord.gg/fthrclips" target="_blank" rel="noopener noreferrer">
            <span class="link-card__start">
                <span class="link-card__icon" aria-hidden="true"><img src="assets/discord.svg" alt=""></span>
                <span>FTHRClips Discord</span>
            </span>
            <span class="arrow" aria-hidden="true">&nearr;</span>
        </a>
    </main>

    <script src="script.js?v=4"></script>
</body>
</html>
